<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil AI Stream</title>
    <meta http-equiv="refresh" content="3;url=/">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0c18;
            color: white;
            font-family: 'Inter', sans-serif;
            text-align: center;
        }
        .container { padding: 2rem; }
        h1 { font-size: 6rem; font-weight: 900; color: #34d399; opacity: 0.3; }
        h2 { font-size: 1.5rem; margin: 1rem 0; }
        p { color: rgba(255,255,255,0.5); margin-bottom: 2rem; }
        a {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        a:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist. Redirecting to home...</p>
        <a href="/">Go to Home</a>
    </div>
</body>
</html>
