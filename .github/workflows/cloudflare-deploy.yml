
name: Cloudflare Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ cfat_9uwUc956qqmyY5uibUNdH6hnIIcemtWRlKheVVfPbcf638f7 }}
          accountId: ${{ 83d470fac07f780ab4573b8e9f82774c }}
          command: pages deploy . --project-name=tamil-ai-stream
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
