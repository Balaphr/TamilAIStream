
name: Deploy Website to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v6

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ cfat_vtUl8yYjxXD1RWvPWtaZL1p2K3gBJdcbk0Wpn9Ny9bce0ca8 }}
          accountId: ${{ 83d470fac07f780ab4573b8e9f82774c }}
          command: pages deploy ./dist --project-name=YOUR_CLOUDFLARE_PROJECT_NAME
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
