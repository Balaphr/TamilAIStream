<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil AI Stream — Admin Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --tb-bg: rgba(10, 10, 10, 0.95);
            --tb-border: rgba(16, 185, 129, 0.25);
            --tb-height: 52px;
            --tb-accent: #10b981;
            --tb-accent-hover: #34d399;
            --tb-text: #ffffff;
            --tb-text-dim: rgba(255, 255, 255, 0.5);
            --tb-danger: #ef4444;
            --tb-radius: 8px;
        }

        html, body { height: 100%; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }

        /* ── Admin Toolbar ── */
        #admin-toolbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 999999;
            height: var(--tb-height);
            background: var(--tb-bg);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-bottom: 1px solid var(--tb-border);
            display: flex; align-items: center; gap: 10px;
            padding: 0 14px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.5), 0 0 40px rgba(16,185,129,0.08);
            font-size: 13px;
        }

        #admin-toolbar .tb-brand {
            display: flex; align-items: center; gap: 8px;
            font-weight: 700; font-size: 14px; color: var(--tb-accent);
            white-space: nowrap; margin-right: 6px;
        }
        #admin-toolbar .tb-brand i { font-size: 16px; }

        #admin-toolbar .tb-divider {
            width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 4px;
        }

        /* Staging indicator */
        .tb-staging {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 12px; border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer; user-select: none;
            transition: all 0.2s;
        }
        .tb-staging:hover { background: rgba(255,255,255,0.10); }
        .tb-staging.active { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.4); }

        .tb-staging .tb-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--tb-text-dim);
            transition: background 0.3s;
        }
        .tb-staging.active .tb-dot { background: var(--tb-accent); box-shadow: 0 0 8px rgba(16,185,129,0.6); }
        .tb-staging .tb-label { color: var(--tb-text-dim); font-weight: 500; transition: color 0.2s; }
        .tb-staging.active .tb-label { color: var(--tb-accent); }

        /* Status text */
        .tb-status { color: var(--tb-text-dim); font-size: 12px; white-space: nowrap; }

        /* Action buttons */
        .tb-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: var(--tb-radius);
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            color: var(--tb-text); font-weight: 500; font-size: 12px;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
            text-decoration: none;
        }
        .tb-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
        .tb-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .tb-btn-accent {
            background: rgba(16,185,129,0.15);
            border-color: rgba(16,185,129,0.4);
            color: var(--tb-accent);
        }
        .tb-btn-accent:hover:not(:disabled) {
            background: rgba(16,185,129,0.25);
            border-color: var(--tb-accent);
            box-shadow: 0 0 16px rgba(16,185,129,0.2);
        }

        .tb-btn-danger {
            color: var(--tb-danger);
            border-color: rgba(239,68,68,0.3);
        }
        .tb-btn-danger:hover:not(:disabled) {
            background: rgba(239,68,68,0.15);
            border-color: rgba(239,68,68,0.5);
        }

        /* Spacer */
        .tb-spacer { flex: 1; }

        /* Toast */
        .tb-toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
            padding: 10px 20px; border-radius: 10px; z-index: 9999999;
            font-size: 13px; font-weight: 500; opacity: 0;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .tb-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .tb-toast-success { background: rgba(16,185,129,0.9); color: #fff; border-color: rgba(16,185,129,0.6); }
        .tb-toast-error   { background: rgba(239,68,68,0.9); color: #fff; border-color: rgba(239,68,68,0.6); }
        .tb-toast-info    { background: rgba(59,130,246,0.9); color: #fff; border-color: rgba(59,130,246,0.6); }

        /* Diff Modal */
        .tb-modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 9999998;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            align-items: center; justify-content: center;
        }
        .tb-modal-overlay.open { display: flex; }
        .tb-modal {
            background: #111; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; width: 90%; max-width: 640px; max-height: 80vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .tb-modal-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .tb-modal-head h3 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .tb-modal-close {
            width: 32px; height: 32px; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.06); color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
            transition: background 0.2s;
        }
        .tb-modal-close:hover { background: rgba(255,255,255,0.12); }
        .tb-modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }

        .diff-section {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .diff-section:last-child { border-bottom: none; }
        .diff-section-head {
            display: flex; align-items: center; gap: 8px;
            font-weight: 600; font-size: 13px; margin-bottom: 6px;
        }
        .diff-badge {
            font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .diff-badge-modified { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .diff-badge-added    { background: rgba(16,185,129,0.2); color: #10b981; }
        .diff-badge-removed  { background: rgba(239,68,68,0.2); color: #ef4444; }
        .diff-badge-unchanged { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); }
        .diff-counts { font-size: 12px; color: rgba(255,255,255,0.5); margin-left: auto; }

        .diff-items { margin-top: 4px; padding-left: 20px; }
        .diff-item { font-size: 12px; color: rgba(255,255,255,0.6); padding: 2px 0; }
        .diff-item-added   { color: #34d399; }
        .diff-item-removed { color: #f87171; }

        .tb-modal-foot {
            padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: flex-end; gap: 8px;
        }

        .diff-empty {
            text-align: center; padding: 40px 20px; color: rgba(255,255,255,0.4);
        }
        .diff-empty i { font-size: 36px; margin-bottom: 12px; display: block; }
        .diff-empty h4 { font-size: 15px; margin-bottom: 6px; color: rgba(255,255,255,0.6); }
        .diff-empty p { font-size: 12px; }

        /* ── Site Iframe ── */
        #site-frame {
            position: fixed;
            top: var(--tb-height); left: 0; right: 0; bottom: 0;
            border: none; width: 100%; height: calc(100vh - var(--tb-height));
        }
    </style>
</head>
<body>

    <!-- ── Admin Toolbar ── -->
    <div id="admin-toolbar">
        <div class="tb-brand">
            <i class="fas fa-shield-halved"></i>
            <span>TamilAI Stream</span>
        </div>

        <div class="tb-divider"></div>

        <!-- Staging Toggle -->
        <div class="tb-staging" id="tbStaging" title="Toggle Staging Mode">
            <span class="tb-dot"></span>
            <span class="tb-label">Staging: OFF</span>
        </div>

        <div class="tb-divider"></div>

        <!-- Status -->
        <span class="tb-status" id="tbStatus">Loading...</span>

        <div class="tb-spacer"></div>

        <!-- Action Buttons -->
        <button class="tb-btn" id="tbReviewBtn" title="Review pending changes">
            <i class="fas fa-code-compare"></i> Review
        </button>
        <button class="tb-btn tb-btn-accent" id="tbPublishBtn" title="Publish staging to public">
            <i class="fas fa-rocket"></i> Publish
        </button>
        <button class="tb-btn tb-btn-danger" id="tbDiscardBtn" title="Discard staging changes">
            <i class="fas fa-trash-restore"></i> Discard
        </button>

        <div class="tb-divider"></div>

        <!-- Site Links -->
        <a class="tb-btn" href="builder.html" target="_blank" title="Open Builder">
            <i class="fas fa-tools"></i>
        </a>
        <a class="tb-btn" href="/" target="_blank" title="Open Public Site">
            <i class="fas fa-external-link-alt"></i>
        </a>
    </div>

    <!-- ── Diff Modal ── -->
    <div class="tb-modal-overlay" id="diffModal">
        <div class="tb-modal">
            <div class="tb-modal-head">
                <h3><i class="fas fa-code-compare"></i> Pending Changes</h3>
                <button class="tb-modal-close" id="diffModalClose"><i class="fas fa-xmark"></i></button>
            </div>
            <div class="tb-modal-body" id="diffModalBody"></div>
            <div class="tb-modal-foot">
                <button class="tb-btn" id="diffModalCloseBtn">Close</button>
                <button class="tb-btn tb-btn-danger" id="diffModalDiscard"><i class="fas fa-trash-restore"></i> Discard</button>
                <button class="tb-btn tb-btn-accent" id="diffModalPublish"><i class="fas fa-rocket"></i> Publish</button>
            </div>
        </div>
    </div>

    <!-- ── Full Website Iframe ── -->
    <iframe id="site-frame" src="/"></iframe>

    <!-- ── Scripts ── -->
    <script src="publish-manager.js"></script>
    <script>
    (function() {
        const $ = id => document.getElementById(id);
        const stagingEl     = $('tbStaging');
        const stagingLabel  = stagingEl.querySelector('.tb-label');
        const statusEl      = $('tbStatus');
        const reviewBtn     = $('tbReviewBtn');
        const publishBtn    = $('tbPublishBtn');
        const discardBtn    = $('tbDiscardBtn');
        const diffModal     = $('diffModal');
        const diffBody      = $('diffModalBody');
        const diffClose     = $('diffModalClose');
        const diffCloseBtn  = $('diffModalCloseBtn');
        const diffPublish   = $('diffModalPublish');
        const diffDiscard   = $('diffModalDiscard');

        /* ── Toast ── */
        function toast(msg, type) {
            const t = document.createElement('div');
            t.className = 'tb-toast tb-toast-' + (type || 'info');
            t.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle') + '"></i> ' + msg;
            document.body.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 4000);
        }

        /* ── Refresh Status ── */
        async function refreshStatus() {
            try {
                const st = await PublishManager.refreshStatus();
                const isStaging = PublishManager.isStagingMode();

                stagingEl.classList.toggle('active', isStaging);
                stagingLabel.textContent = isStaging ? 'Staging: ON' : 'Staging: OFF';

                if (st.hasStaging) {
                    const dt = st.stagingSavedAt ? new Date(st.stagingSavedAt).toLocaleString() : '';
                    statusEl.textContent = 'Pending changes' + (dt ? ' — saved ' + dt : '');
                    reviewBtn.style.display = '';
                    publishBtn.style.display = '';
                    discardBtn.style.display = '';
                } else {
                    statusEl.textContent = 'No pending changes';
                    reviewBtn.style.display = 'none';
                    publishBtn.style.display = 'none';
                    discardBtn.style.display = 'none';
                }
            } catch (e) {
                statusEl.textContent = 'Could not load status';
                console.error('[Admin] refreshStatus error:', e);
            }
        }

        /* ── Staging Toggle ── */
        stagingEl.addEventListener('click', () => {
            if (PublishManager.isStagingMode()) {
                PublishManager.exitStagingMode();
                toast('Staging OFF — changes publish directly', 'info');
            } else {
                PublishManager.enterStagingMode();
                toast('Staging ON — changes saved to staging', 'info');
            }
            refreshStatus();
        });

        /* ── Publish ── */
        publishBtn.addEventListener('click', async () => {
            if (!confirm('Publish staging changes to the public website?')) return;
            publishBtn.disabled = true;
            publishBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Publishing…';
            try {
                await PublishManager.publish();
                toast('Changes published to public website!', 'success');
                refreshStatus();
            } catch (e) {
                toast('Publish failed: ' + e.message, 'error');
            }
            publishBtn.disabled = false;
            publishBtn.innerHTML = '<i class="fas fa-rocket"></i> Publish';
        });

        /* ── Discard ── */
        discardBtn.addEventListener('click', async () => {
            if (!confirm('Discard all staging changes?')) return;
            try {
                await PublishManager.discardStaging();
                toast('Staging changes discarded', 'info');
                refreshStatus();
            } catch (e) {
                toast('Discard failed: ' + e.message, 'error');
            }
        });

        /* ── Review / Diff Modal ── */
        reviewBtn.addEventListener('click', async () => {
            diffModal.classList.add('open');
            diffBody.innerHTML = '<div class="diff-empty"><i class="fas fa-spinner fa-spin"></i><p>Loading…</p></div>';
            const diff = await PublishManager.getDiff();
            renderDiff(diff);
        });
        diffClose.addEventListener('click', () => diffModal.classList.remove('open'));
        diffCloseBtn.addEventListener('click', () => diffModal.classList.remove('open'));

        diffPublish.addEventListener('click', async () => {
            if (!confirm('Publish all staging changes?')) return;
            try {
                await PublishManager.publish();
                toast('Published!', 'success');
                diffModal.classList.remove('open');
                refreshStatus();
            } catch (e) { toast('Publish failed: ' + e.message, 'error'); }
        });
        diffDiscard.addEventListener('click', async () => {
            if (!confirm('Discard all staging changes?')) return;
            try {
                await PublishManager.discardStaging();
                toast('Discarded', 'info');
                diffModal.classList.remove('open');
                refreshStatus();
            } catch (e) { toast('Discard failed: ' + e.message, 'error'); }
        });

        function renderDiff(diff) {
            if (!diff || !diff.hasChanges || !diff.changes || !diff.changes.length) {
                diffBody.innerHTML =
                    '<div class="diff-empty">' +
                    '<i class="fas fa-check-circle"></i>' +
                    '<h4>No Pending Changes</h4>' +
                    '<p>Toggle Staging ON, make changes in the Builder, then come back to review and publish.</p>' +
                    '</div>';
                return;
            }

            const statusMap = {
                modified:      { icon: 'fa-pen-to-square', color: '#f59e0b', badge: 'diff-badge-modified', label: 'Modified' },
                added:         { icon: 'fa-plus-circle',   color: '#10b981', badge: 'diff-badge-added',    label: 'Added' },
                removed:       { icon: 'fa-minus-circle',  color: '#ef4444', badge: 'diff-badge-removed',  label: 'Removed' },
                items_added:   { icon: 'fa-arrow-up',      color: '#10b981', badge: 'diff-badge-added',    label: 'Items Added' },
                items_removed: { icon: 'fa-arrow-down',    color: '#ef4444', badge: 'diff-badge-removed',  label: 'Items Removed' },
            };

            diffBody.innerHTML = diff.changes.map(ch => {
                const m = statusMap[ch.status] || statusMap.modified;
                let itemsHtml = '';
                if (ch.itemChanges && ch.itemChanges.length) {
                    itemsHtml = '<div class="diff-items">' + ch.itemChanges.map(ic =>
                        '<div class="diff-item ' + (ic.type === 'added' ? 'diff-item-added' : 'diff-item-removed') + '">' +
                        '<i class="fas fa-' + (ic.type === 'added' ? 'plus' : 'minus') + '-circle"></i> ' +
                        (ic.name || ic.id || JSON.stringify(ic))
                        + '</div>'
                    ).join('') + '</div>';
                }
                return '<div class="diff-section">' +
                    '<div class="diff-section-head">' +
                    '<span class="diff-badge ' + m.badge + '">' + m.label + '</span> ' +
                    '<span style="font-weight:600">' + ch.section + '</span>' +
                    (ch.publishedItems != null || ch.stagingItems != null ?
                        '<span class="diff-counts">' +
                        (ch.publishedItems != null ? 'Published: ' + ch.publishedItems + '  ' : '') +
                        (ch.stagingItems != null ? 'Staging: ' + ch.stagingItems : '') +
                        '</span>' : '') +
                    '</div>' + itemsHtml + '</div>';
            }).join('');
        }

        /* ── Iframe intercept: force staging on write ── */
        const frame = $('site-frame');
        frame.addEventListener('load', () => {
            try {
                const win = frame.contentWindow;
                if (win && win.ContentSync) {
                    const orig = win.ContentSync.syncCurrentState.bind(win.ContentSync);
                    win.ContentSync.syncCurrentState = async function() {
                        if (PublishManager.isStagingMode()) {
                            const keys = [
                                'songs','stations','categories','featured','trending',
                                'artistHits','quotes','layout','tamilpodcasts',
                                'englishpodcasts','hindipodcasts','premiumPodcasts',
                                'radiostations','tamilradios','hindiradios','englishradios',
                                'advertisements','minisettings','hero','siteconfig'
                            ];
                            const payload = { keys, data: {}, savedAt: new Date().toISOString(), source: 'admin-iframe' };
                            keys.forEach(k => { try { payload.data[k] = win.DataStore.getXxx ? win.DataStore['get' + k.charAt(0).toUpperCase() + k.slice(1)]() : null; } catch(e) { payload.data[k] = null; } });
                            await fetch('/api/staging', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                            refreshStatus();
                        } else {
                            return orig();
                        }
                    };
                }
            } catch (e) { /* cross-origin */ }
        });

        /* ── Init ── */
        refreshStatus();
    })();
    </script>
</body>
</html>
