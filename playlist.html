<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Hits - Playlist | Tamil AI Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="playlist.css">
    <link rel="stylesheet" href="global-player.css">
</head>
<body>
    <div class="noise-overlay"></div>
    
    <!-- Animated Background -->
    <div class="bg-container">
        <div class="gradient-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
            <div class="orb orb-4"></div>
            <div class="orb orb-5"></div>
        </div>
        <canvas id="particles-canvas"></canvas>
    </div>

    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="nav-container">
            <div class="nav-left">
                <div class="nav-logo">
                    <div class="logo-icon"><i class="fas fa-microphone-alt"></i></div>
                    <div class="logo-text">
                        <h1>Tamil AI Stream</h1>
                        <span>AI-Powered Radio</span>
                    </div>
                </div>
            </div>
            <div class="nav-center">
                <div class="search-bar">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Search songs..." autocomplete="off">
                    <button class="search-clear" id="searchClear"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="nav-right">
                <button class="nav-icon-btn" aria-label="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="nav-badge">3</span>
                </button>
                <button class="nav-icon-btn" aria-label="Favorites">
                    <i class="fas fa-heart"></i>
                </button>
                <div class="nav-avatar" id="userAvatar">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2334d399' opacity='0.2'/%3E%3Ccircle cx='50' cy='35' r='20' fill='%2334d399' opacity='0.6'/%3E%3Ccircle cx='50' cy='80' r='30' fill='%2334d399' opacity='0.4'/%3E%3C/svg%3E" alt="Profile">
                </div>
                <button class="logout-btn" id="logoutBtn" aria-label="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="playlist-page-main">
        <div class="playlist-container">
            <!-- Playlist Hero -->
            <div class="playlist-hero">
                <div class="playlist-hero-image" id="playlistHeroImage">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 220'%3E%3Ccircle cx='110' cy='90' r='50' fill='%2334d399' opacity='0.3'/%3E%3Cpath d='M50 180 Q110 200 170 180 L170 220 L50 220 Z' fill='%2334d399' opacity='0.25'/%3E%3C/svg%3E" alt="Playlist" id="playlistHeroImg">
                </div>
                <div class="playlist-hero-info">
                    <div class="playlist-hero-type">Artist Hits</div>
                    <h1 class="playlist-hero-title" id="playlistTitle">Loading...</h1>
                    <p class="playlist-hero-meta" id="playlistMeta">Loading songs...</p>
                    <div class="playlist-hero-actions">
                        <button class="playlist-play-all-btn" id="playAllBtn">
                            <i class="fas fa-play"></i> Play All
                        </button>
                        <button class="playlist-shuffle-btn" id="shuffleAllBtn">
                            <i class="fas fa-shuffle"></i> Shuffle
                        </button>
                    </div>
                </div>
            </div>

            <!-- Songs List -->
            <div class="playlist-songs-header">
                <div>#</div>
                <div>Title</div>
                <div class="playlist-song-movie">Movie</div>
                <div>Duration</div>
                <div></div>
            </div>
            <div class="playlist-songs-list" id="playlistSongsList">
                <!-- Songs will be populated by JavaScript -->
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var playlistData = null;
            try {
                var raw = localStorage.getItem('tamilAIStream_currentPlaylist');
                if (raw) playlistData = JSON.parse(raw);
            } catch(e) {}

            if (!playlistData || !playlistData.artist) {
                playlistData = { artist: 'dhanush', artistName: 'Dhanush Hits', songCount: 156, songs: [] };
            }

            document.getElementById('playlistTitle').textContent = playlistData.artistName || playlistData.artist;
            document.getElementById('playlistMeta').textContent = (playlistData.songs ? playlistData.songs.length : playlistData.songCount) + ' songs';

            var songsList = document.getElementById('playlistSongsList');
            if (playlistData.songs && playlistData.songs.length > 0) {
                songsList.innerHTML = playlistData.songs.map(function(song, i) {
                    return '<div class="playlist-song-row" data-index="' + i + '">' +
                        '<div class="playlist-song-number">' + (i + 1) + '</div>' +
                        '<div class="playlist-song-info">' +
                            '<div class="playlist-song-title">' + (song.title || 'Unknown') + '</div>' +
                            '<div class="playlist-song-artist">' + (song.artist || 'Unknown') + '</div>' +
                        '</div>' +
                        '<div class="playlist-song-movie">' + (song.movie || 'N/A') + '</div>' +
                        '<div class="playlist-song-duration">' + (song.duration || '3:30') + '</div>' +
                        '<div class="playlist-song-actions">' +
                            '<button class="playlist-song-play" data-index="' + i + '"><i class="fas fa-play"></i></button>' +
                        '</div>' +
                    '</div>';
                }).join('');
            } else {
                var placeholderSongs = [];
                for (var s = 1; s <= Math.min(playlistData.songCount || 10, 20); s++) {
                    placeholderSongs.push(
                        '<div class="playlist-song-row" data-index="' + s + '">' +
                            '<div class="playlist-song-number">' + s + '</div>' +
                            '<div class="playlist-song-info">' +
                                '<div class="playlist-song-title">' + (playlistData.artistName || playlistData.artist) + ' Song ' + s + '</div>' +
                                '<div class="playlist-song-artist">' + (playlistData.artistName || playlistData.artist) + '</div>' +
                            '</div>' +
                            '<div class="playlist-song-movie">Tamil Movie</div>' +
                            '<div class="playlist-song-duration">3:' + (s < 10 ? '0' : '') + (s * 7 % 60) + '</div>' +
                            '<div class="playlist-song-actions">' +
                                '<button class="playlist-song-play" data-index="' + s + '"><i class="fas fa-play"></i></button>' +
                            '</div>' +
                        '</div>'
                    );
                }
                songsList.innerHTML = placeholderSongs.join('');
            }

            document.getElementById('playAllBtn').addEventListener('click', function() {
                if (playlistData.songs && playlistData.songs.length > 0) {
                    var firstSong = playlistData.songs[0];
                    if (firstSong.audioUrl && typeof window.playSong === 'function') {
                        window.playSong(firstSong, playlistData.songs);
                    } else {
                        var firstPlay = songsList.querySelector('.playlist-song-play');
                        if (firstPlay) firstPlay.click();
                    }
                } else {
                    var firstPlay = songsList.querySelector('.playlist-song-play');
                    if (firstPlay) firstPlay.click();
                }
            });

            document.getElementById('shuffleAllBtn').addEventListener('click', function() {
                if (playlistData.songs && playlistData.songs.length > 0) {
                    var shuffled = playlistData.songs.slice().sort(function() { return Math.random() - 0.5 });
                    var firstSong = shuffled[0];
                    if (firstSong.audioUrl && typeof window.playSong === 'function') {
                        window.playSong(firstSong, shuffled);
                    } else {
                        var plays = songsList.querySelectorAll('.playlist-song-play');
                        if (plays.length > 0) {
                            var randomIndex = Math.floor(Math.random() * plays.length);
                            plays[randomIndex].click();
                        }
                    }
                } else {
                    var plays = songsList.querySelectorAll('.playlist-song-play');
                    if (plays.length > 0) {
                        var randomIndex = Math.floor(Math.random() * plays.length);
                        plays[randomIndex].click();
                    }
                }
            });

            songsList.addEventListener('click', function(e) {
                var playBtn = e.target.closest('.playlist-song-play');
                if (playBtn) {
                    var idx = parseInt(playBtn.dataset.index);
                    var row = playBtn.closest('.playlist-song-row');
                    var title = row.querySelector('.playlist-song-title').textContent;
                    var artist = row.querySelector('.playlist-song-artist').textContent;
                    
                    if (playlistData.songs && playlistData.songs[idx] && playlistData.songs[idx].audioUrl && typeof window.playSong === 'function') {
                        window.playSong(playlistData.songs[idx], playlistData.songs);
                    }
                    
                    var npTitle = document.querySelector('.now-playing-title');
                    var npStation = document.querySelector('.now-playing-station');
                    if (npTitle) npTitle.textContent = title;
                    if (npStation) npStation.textContent = artist;
                    if (typeof window.showToast === 'function') {
                        window.showToast('Now playing: ' + title, 'info');
                    }
                    songsList.querySelectorAll('.playlist-song-row').forEach(function(r) { r.classList.remove('playing'); });
                    row.classList.add('playing');
                }
            });

            var logo = document.querySelector('.nav-logo');
            if (logo) {
                logo.style.cursor = 'pointer';
                logo.addEventListener('click', function() { window.location.href = 'index.html'; });
            }
        });
    </script>
<script src="auth.js"></script>
    <script src="script.js"></script>
    <script src="player-engine.js"></script>
    <script src="global-player.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof PlayerEngine !== 'undefined') PlayerEngine.init();
            GlobalPlayer.init();
        });
    </script>
</body>
</html>
