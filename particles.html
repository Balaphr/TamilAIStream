<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Background</title>
    <link rel="stylesheet" href="particles.css">
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <div class="content">
        <h1>Particle Background</h1>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [], mouse = { x: null, y: null };
        const PARTICLE_COUNT = 80;
        const CONNECTION_DIST = 150;
        const COLORS = [
            '0, 191, 165',
            '0, 230, 255',
            '100, 255, 218',
            '0, 150, 136',
            '76, 175, 80',
            '128, 222, 234',
            '0, 200, 180'
        ];

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function createParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const isLarge = Math.random() > 0.7;
                const baseSize = isLarge ? Math.random() * 4 + 3 : Math.random() * 2 + 0.5;
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: baseSize,
                    baseSize: baseSize,
                    speedX: (Math.random() - 0.5) * 0.4,
                    speedY: (Math.random() - 0.5) * 0.4,
                    opacity: Math.random() * 0.5 + 0.2,
                    pulse: Math.random() * Math.PI * 2,
                    pulseSpeed: Math.random() * 0.02 + 0.005,
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    blur: isLarge ? Math.random() * 15 + 10 : Math.random() * 5 + 2,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function drawParticle(p) {
            const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * p.blur);
            glow.addColorStop(0, `rgba(${p.color}, ${p.opacity * 0.9})`);
            glow.addColorStop(0.4, `rgba(${p.color}, ${p.opacity * 0.3})`);
            glow.addColorStop(1, `rgba(${p.color}, 0)`);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.blur, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.color}, ${p.opacity})`;
            ctx.fill();
        }

        function drawConnection(a, b) {
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < CONNECTION_DIST) {
                const alpha = 0.12 * (1 - dist / CONNECTION_DIST);
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = `rgba(0, 230, 255, ${alpha})`;
                ctx.lineWidth = 0.6;
                ctx.stroke();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.pulse += p.pulseSpeed;
                p.x += p.speedX + Math.sin(p.phase + p.pulse) * 0.2;
                p.y += p.speedY + Math.cos(p.phase + p.pulse) * 0.2;

                if (p.x < 0) p.x = w;
                if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h;
                if (p.y > h) p.y = 0;

                const pulseOpacity = p.opacity + Math.sin(p.pulse) * 0.15;
                p.opacity = Math.max(0.1, Math.min(0.8, pulseOpacity));

                drawParticle(p);

                for (let j = i + 1; j < particles.length; j++) {
                    drawConnection(p, particles[j]);
                }
            }

            requestAnimationFrame(animate);
        }

        function init() {
            resize();
            createParticles();
            animate();
        }

        window.addEventListener('resize', () => {
            resize();
            createParticles();
        });

        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        document.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        init();
    })();
    </script>
</body>
</html>
