name = "tamil-ai-stream"
main = "src/index.js"
compatibility_date = "2024-09-23"

routes = [
  { pattern = "tamilai.stream/*", zone_name = "tamilai.stream" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "tamil-ai-stream-media"

# Admin HMAC secret — set via: wrangler secret put ADMIN_HMAC_SECRET
# Use a strong random string (32+ chars). Example: openssl rand -hex 32
# [vars]
# ADMIN_HMAC_SECRET = "set-via-wrangler-secret-put"

[triggers]
crons = ["*/10 * * * *"]
