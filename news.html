<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil News - TamilAI.Stream</title>
    <meta name="description" content="Latest Tamil News from top sources - TamilAI.Stream">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="global-player.css">
    <link rel="stylesheet" href="news.css">
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .news-page { max-width: 1200px; margin: 0 auto; padding: 24px 16px 120px; }
        .news-page-header { text-align: center; margin-bottom: 32px; }
        .news-page-header h1 { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #f59e0b, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .news-page-header p { color: #9ca3af; margin-top: 8px; }
        .news-category-filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 24px; }
        .news-filter-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #d1d5db; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .news-filter-btn:hover { background: rgba(255,255,255,0.1); }
        .news-filter-btn.active { background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; border-color: transparent; }
    </style>
</head>
<body>
    <div class="news-page">
        <div class="news-page-header">
            <a href="/" style="color:#34d399;text-decoration:none;font-size:14px;"><i class="fas fa-arrow-left"></i> Back to Home</a>
            <h1><i class="fas fa-newspaper"></i> Latest Tamil News</h1>
            <p>Automatically updated from trusted Tamil news sources</p>
        </div>
        <div class="news-category-filters" id="newsCategoryFilters">
            <button class="news-filter-btn active" data-cat="all">All</button>
            <button class="news-filter-btn" data-cat="Breaking News">Breaking</button>
            <button class="news-filter-btn" data-cat="Tamil Nadu">Tamil Nadu</button>
            <button class="news-filter-btn" data-cat="India">India</button>
            <button class="news-filter-btn" data-cat="Cinema">Cinema</button>
            <button class="news-filter-btn" data-cat="Sports">Sports</button>
            <button class="news-filter-btn" data-cat="Technology">Tech</button>
            <button class="news-filter-btn" data-cat="Business">Business</button>
            <button class="news-filter-btn" data-cat="World">World</button>
            <button class="news-filter-btn" data-cat="Trending">Trending</button>
        </div>
        <div class="news-grid" id="newsPageGrid"></div>
    </div>

    <script src="data-store.js"></script>
    <script src="player-engine.js"></script>
    <script src="global-player.js"></script>
    <script src="news.js"></script>
    <script>
        let _newsPageArticles = [];
        let _activeFilter = 'all';

        async function loadNewsPage() {
            await TamilNews.loadNews();
            _newsPageArticles = TamilNews.articles;
            filterAndRender();
            TamilNews.startAutoRefresh();
            setInterval(() => {
                TamilNews.loadNews().then(() => {
                    _newsPageArticles = TamilNews.articles;
                    filterAndRender();
                });
            }, 5 * 60 * 1000);
        }

        function filterAndRender() {
            const grid = document.getElementById('newsPageGrid');
            if (!grid) return;
            let filtered = _newsPageArticles;
            if (_activeFilter !== 'all') {
                filtered = filtered.filter(a => a.category === _activeFilter);
            }
            if (!filtered.length) {
                grid.innerHTML = '<div class="news-empty"><i class="fas fa-newspaper"></i><p>No news articles found.</p></div>';
                return;
            }
            grid.innerHTML = filtered.map(article => {
                const timeAgo = getTimeAgo(article.pubDate);
                const catClass = getCatClass(article.category);
                const thumbHtml = article.thumbnail
                    ? `<div class="news-card-thumb"><img src="${esc(article.thumbnail)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'news-card-thumb-placeholder\\'><i class=\\'fas fa-newspaper\\'></i></div>'"></div>`
                    : `<div class="news-card-thumb"><div class="news-card-thumb-placeholder"><i class="fas fa-newspaper"></i></div></div>`;
                return `
                <article class="news-card">
                    ${thumbHtml}
                    <div class="news-card-body">
                        <div class="news-card-meta">
                            <span class="news-card-category ${catClass}">${esc(article.category || 'General')}</span>
                            <span class="news-card-source">${esc(article.feedName || '')}</span>
                            <span class="news-card-time">${timeAgo}</span>
                        </div>
                        <h3 class="news-card-title">${esc(article.title)}</h3>
                        <p class="news-card-desc">${esc((article.description || '').substring(0, 150))}${(article.description || '').length > 150 ? '...' : ''}</p>
                        <a class="news-card-btn" href="${esc(article.url)}" target="_blank" rel="noopener noreferrer">
                            <i class="fas fa-external-link-alt"></i> Read Full News
                        </a>
                    </div>
                </article>`;
            }).join('');
        }

        function getTimeAgo(dateStr) {
            if (!dateStr) return '';
            const diff = Date.now() - new Date(dateStr).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'Just now';
            if (mins < 60) return mins + 'm ago';
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return hrs + 'h ago';
            return Math.floor(hrs / 24) + 'd ago';
        }

        function getCatClass(c) {
            const m = {'Breaking News':'cat-breaking','Tamil Nadu':'cat-tn','India':'cat-india','Cinema':'cat-cinema','Sports':'cat-sports','Technology':'cat-tech','Business':'cat-business','World':'cat-world','Trending':'cat-trending'};
            return m[c] || 'cat-general';
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

        document.getElementById('newsCategoryFilters')?.addEventListener('click', (e) => {
            const btn = e.target.closest('.news-filter-btn');
            if (!btn) return;
            document.querySelectorAll('.news-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            _activeFilter = btn.dataset.cat;
            filterAndRender();
        });

        document.addEventListener('DOMContentLoaded', loadNewsPage);
    </script>
</body>
</html>
