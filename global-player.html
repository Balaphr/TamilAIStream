<!-- Global Music Player - Fixed at bottom of all pages -->
<div class="global-player" id="globalPlayer">
    <!-- Mini Player (Default View) -->
    <div class="player-mini" id="playerMini">
        <div class="player-mini-progress" id="playerMiniProgress">
            <div class="player-mini-progress-filled" id="playerMiniProgressFilled"></div>
        </div>
        
        <div class="player-mini-content">
            <div class="player-mini-left">
                <div class="player-mini-thumb" id="playerMiniThumb">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%231a3b2e'/%3E%3Ccircle cx='24' cy='24' r='16' fill='%2334d399' opacity='0.3'/%3E%3C/svg%3E" alt="Now Playing" id="playerMiniThumbImg">
                </div>
                <div class="player-mini-info">
                    <div class="player-mini-title" id="playerMiniTitle">No track playing</div>
                    <div class="player-mini-artist" id="playerMiniArtist">Select a song to start</div>
                </div>
            </div>
            
            <div class="player-mini-center">
                <button class="player-mini-btn" id="playerMiniShuffle" onclick="GlobalPlayer.toggleShuffle()" title="Shuffle">
                    <i class="fas fa-shuffle"></i>
                </button>
                <button class="player-mini-btn" onclick="GlobalPlayer.previous()" title="Previous">
                    <i class="fas fa-backward-step"></i>
                </button>
                <button class="player-mini-btn player-mini-play-btn" id="playerMiniPlayBtn" onclick="GlobalPlayer.togglePlay()" title="Play/Pause">
                    <i class="fas fa-play"></i>
                </button>
                <button class="player-mini-btn" onclick="GlobalPlayer.next()" title="Next">
                    <i class="fas fa-forward-step"></i>
                </button>
                <button class="player-mini-btn" id="playerMiniRepeat" onclick="GlobalPlayer.toggleRepeat()" title="Repeat">
                    <i class="fas fa-repeat"></i>
                </button>
            </div>
            
            <div class="player-mini-right">
                <div class="player-mini-time">
                    <span id="playerMiniCurrentTime">0:00</span> / <span id="playerMiniTotalTime">0:00</span>
                </div>
                <button class="player-mini-btn" onclick="GlobalPlayer.toggleQueue()" title="Queue">
                    <i class="fas fa-list"></i>
                </button>
                <button class="player-mini-btn" id="playerMiniVolumeBtn" onclick="GlobalPlayer.toggleMute()" title="Volume">
                    <i class="fas fa-volume-high"></i>
                </button>
                <div class="player-mini-volume" id="playerMiniVolume">
                    <div class="player-mini-volume-filled" id="playerMiniVolumeFilled" style="width: 70%"></div>
                </div>
                <button class="player-mini-btn" onclick="GlobalPlayer.toggleFullscreen()" title="Expand">
                    <i class="fas fa-chevron-up"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Fullscreen Player (Hidden by default) -->
    <div class="player-fullscreen" id="playerFullscreen" style="display: none;">
        <div class="player-fullscreen-header">
            <button class="player-fullscreen-btn" onclick="GlobalPlayer.toggleFullscreen()" title="Minimize">
                <i class="fas fa-chevron-down"></i>
            </button>
            <div class="player-fullscreen-title">Now Playing</div>
            <button class="player-fullscreen-btn" onclick="GlobalPlayer.toggleQueue()" title="Queue">
                <i class="fas fa-list"></i>
            </button>
        </div>
        
        <div class="player-fullscreen-content">
            <div class="player-fullscreen-artwork" id="playerFullscreenArtwork">
                <img src="" alt="Album Art" id="playerFullscreenArtworkImg" style="display: none;">
                <div class="player-fullscreen-artwork-placeholder" id="playerFullscreenArtworkPlaceholder">
                    <i class="fas fa-music"></i>
                </div>
            </div>
            
            <div class="player-fullscreen-info">
                <div class="player-fullscreen-song-title" id="playerFullscreenTitle">No track playing</div>
                <div class="player-fullscreen-artist" id="playerFullscreenArtist">Select a song to start</div>
            </div>
            
            <div class="player-fullscreen-progress">
                <div class="player-fullscreen-progress-bar" id="playerFullscreenProgressBar">
                    <div class="player-fullscreen-progress-buffered" id="playerFullscreenProgressBuffered"></div>
                    <div class="player-fullscreen-progress-filled" id="playerFullscreenProgressFilled"></div>
                    <div class="player-fullscreen-progress-thumb" id="playerFullscreenProgressThumb"></div>
                </div>
                <div class="player-fullscreen-time">
                    <span id="playerFullscreenCurrentTime">0:00</span> / <span id="playerFullscreenTotalTime">0:00</span>
                </div>
            </div>
            
            <div class="player-fullscreen-controls">
                <button class="player-fullscreen-btn" id="playerFullscreenShuffle" onclick="GlobalPlayer.toggleShuffle()" title="Shuffle">
                    <i class="fas fa-shuffle"></i>
                </button>
                <button class="player-fullscreen-btn" onclick="GlobalPlayer.previous()" title="Previous">
                    <i class="fas fa-backward-step"></i>
                </button>
                <button class="player-fullscreen-btn player-fullscreen-play-btn" id="playerFullscreenPlayBtn" onclick="GlobalPlayer.togglePlay()" title="Play/Pause">
                    <i class="fas fa-play"></i>
                </button>
                <button class="player-fullscreen-btn" onclick="GlobalPlayer.next()" title="Next">
                    <i class="fas fa-forward-step"></i>
                </button>
                <button class="player-fullscreen-btn" id="playerFullscreenRepeat" onclick="GlobalPlayer.toggleRepeat()" title="Repeat">
                    <i class="fas fa-repeat"></i>
                </button>
            </div>
            
            <div class="player-fullscreen-extra">
                <button class="player-fullscreen-extra-btn" id="playerFullscreenLikeBtn" onclick="GlobalPlayer.toggleLike()" title="Like">
                    <i class="far fa-heart"></i>
                </button>
                <div class="player-fullscreen-volume">
                    <button class="player-fullscreen-extra-btn" id="playerFullscreenVolumeBtn" onclick="GlobalPlayer.toggleMute()" title="Volume">
                        <i class="fas fa-volume-high"></i>
                    </button>
                    <div class="player-fullscreen-volume-slider" id="playerFullscreenVolumeSlider">
                        <div class="player-fullscreen-volume-filled" id="playerFullscreenVolumeFilled" style="width: 70%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Queue Panel -->
    <div class="player-queue-panel" id="playerQueuePanel">
        <div class="player-queue-header">
            <div class="player-queue-title">Up Next</div>
            <button class="player-queue-close" onclick="GlobalPlayer.toggleQueue()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="player-queue-tabs">
            <button class="player-queue-tab active" data-tab="queue" onclick="GlobalPlayer.setQueueTab('queue')">Queue</button>
            <button class="player-queue-tab" data-tab="history" onclick="GlobalPlayer.setQueueTab('history')">Recently Played</button>
        </div>
        <div class="player-queue-list" id="playerQueueList"></div>
    </div>
</div>

<!-- Audio Element -->
<audio id="globalAudioPlayer" preload="auto"></audio>
